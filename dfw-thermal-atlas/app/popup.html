<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DFW Thermal Debt Atlas</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  color-scheme:light;
  --bg:#eef1f3; --card:#fbfcfc; --sunk:#e4e9ec; --line:#d2d9de; --ink:#10191f; --ink-2:#435059; --ink-3:#687681;
  --navy:#13243a; --navy-ink:#dbe5ef; --navy-mute:#9fb2c6; --accent:#0b6f6d; --accent-ink:#fff;
  --cold:#1c5cab; --cold-bg:#e3edf9; --warn:#86601f; --warn-bg:#f8f1e4; --bad:#a4352e; --bad-bg:#f9ecea; --ok:#0b6f6d;
  --display:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif; --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0c1115;--card:#131a1f;--sunk:#1b242a;--line:#28333b;--ink:#eaf0f2;--ink-2:#b3bec5;--ink-3:#85939d;--navy:#0a1522;--accent:#3cb5b0;--accent-ink:#06201f;--cold:#86b6ef;--cold-bg:#142233;--warn:#d7ad66;--warn-bg:#241e14;--bad:#e5908a;--bad-bg:#2a1a19;--ok:#3cb5b0}}
*{box-sizing:border-box}
body{margin:0;width:392px;font:13px/1.45 var(--sans);color:var(--ink);background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{background:var(--navy);color:var(--navy-ink);padding:12px 14px;display:flex;gap:11px;align-items:center}
header img{width:34px;height:34px;border-radius:9px}
header .nm{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.1;color:#fff}
header .sb{font-size:11px;color:var(--navy-mute);margin-top:2px}
main{padding:10px 12px 8px;display:flex;flex-direction:column;gap:9px;max-height:540px;overflow:auto}
.eyebrow{font:500 10px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.week{border-left:4px solid var(--accent)}
.week.cold{border-left-color:var(--cold);background:var(--cold-bg)}
.week h2{margin:3px 0 2px;font:700 16px/1.2 var(--display)}
.week p{margin:0;color:var(--ink-2);font-size:12.5px}
.week ul{margin:6px 0 0;padding:0 0 0 16px;color:var(--ink-2);font-size:12.5px}
.week li{margin:1px 0}
.week .more{margin-top:7px;padding-top:6px;border-top:1px solid var(--line, rgba(128,128,128,.25))}
.week .more p{margin:2px 0 0}
.week .more b{color:var(--ink)}
.status{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;color:var(--ink-2);margin-top:4px}
.status b{font-weight:600;color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.dot.aging{background:var(--warn)} .dot.stale{background:var(--bad)}
.note{font-size:11.5px;border-radius:7px;padding:6px 8px;margin-top:7px}
.note.bad{background:var(--bad-bg);color:var(--bad)} .note.busy{background:var(--sunk);color:var(--ink-2)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.b{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px;font-weight:600;font-size:12.5px;text-align:center;line-height:1.2}
.b.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);grid-column:1 / -1;font-size:13.5px;padding:10px}
.b:hover{filter:brightness(1.06)} .b[disabled]{opacity:.55;cursor:default}
.q{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:0 10px}
.q svg{width:15px;height:15px;color:var(--ink-3);flex:none}
.q input{flex:1;border:0;background:none;padding:8px 0;outline:none;min-width:0}
.q input::placeholder{color:var(--ink-3)}
.row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 10px;margin-top:4px}
.row:hover,.row:focus-visible{border-color:var(--accent)}
.row .k{font:500 10.5px/1 var(--mono);color:var(--ink-3);background:var(--sunk);border-radius:5px;padding:4px 6px;min-width:26px;text-align:center}
.row .t{font-weight:600;font-size:12.5px;line-height:1.25}
.row .s{font-size:11px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row > div{min-width:0}
.empty{color:var(--ink-3);padding:6px 2px;margin:0}
footer{display:flex;justify-content:space-between;gap:8px;padding:8px 12px 10px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3)}
</style>
</head>
<body>
<header><img src="icons/icon48.png" alt=""><div><div class="nm">DFW Thermal Debt Atlas</div><div class="sb" id="sub">Heating and cooling campaign intelligence</div></div></header>
<main>
  <section class="card week" id="week" aria-live="polite"><div class="eyebrow" id="weekEyebrow">This week</div><h2 id="weekHead">Reading the live data</h2><p id="weekSub"></p><ul id="weekList" hidden></ul><div class="more" id="weekMore" hidden></div></section>
  <div class="btns">
    <button class="b p" id="goHeat" type="button">Open the Heat Desk: where to spend this week</button>
    <button class="b" id="goAtlas" type="button">Open the atlas</button>
    <button class="b" id="goLive" type="button">Live data and sources</button>
  </div>
  <section class="card" id="live"><div class="eyebrow">Live data</div><div class="status" id="status"></div><div id="liveNote"></div>
    <div class="btns" style="margin-top:8px"><button class="b" id="refresh" type="button" style="grid-column:1 / -1">Refresh everything now</button></div></section>
  <div class="q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input id="q" type="search" placeholder="Find a module, a city or a ZIP code" autocomplete="off" aria-label="Find a module, a city or a ZIP code"></div>
  <div id="list" role="list"></div>
</main>
<footer><span id="ver"></span><span>Alt+Shift+H opens the atlas · type <b>tda</b> in the address bar</span></footer>
<!--live--><script src="live/core.js"></script><script src="live/geo.js"></script><script src="live/climate_base.js"></script><script src="live/sources/nws_cold.js"></script><script src="live/sources/cpsc_recalls.js"></script><script src="live/sources/acis_season.js"></script><script src="live/sources/iem_cold.js"></script><script src="live/sources/cpc_outlook.js"></script><script src="live/sources/nbm_extended.js"></script><script src="live/sources/ercot_grid.js"></script><script src="live/permits.js"></script><script src="live/sources/permits_dallas.js"></script><script src="live/sources/permits_fortworth.js"></script><script src="live/sources/tdlr_licenses.js"></script><script src="live/sources/census_acs.js"></script><script src="live/sources/fedreg_rules.js"></script><script src="live/derive.js"></script><script src="live/climate.js"></script><script src="live/cpc_class.js"></script><script src="live/outlook.js"></script><!--/live-->
<script src="registry.js"></script>
<script src="open.js"></script>
<script src="popup.js"></script>
</body>
</html>
